[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nerve-center"
version = "0.12.0"
description = "Local-first orchestration platform for scheduled desktop tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
search = [
  "playwright>=1.49,<2",
]
packaging = [
  "pyinstaller>=6.16,<7",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "reportlab>=4,<5",
  "ruff>=0.6,<1",
]

[project.scripts]
nerve-center-api = "nerve_center.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nerve_center"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/nerve_center/persistence/discovery.py" = ["F401"]
"src/nerve_center/providers/base.py" = ["UP046"]
"src/nerve_center/scheduler/runner.py" = ["E501"]
"src/nerve_center/scheduler/service.py" = ["SIM105"]
"src/nerve_center/scoring/engine.py" = ["E501"]
"src/nerve_center/scoring/fit.py" = ["I001"]
"tests/test_discovery_persistence.py" = ["I001"]
"tests/test_profile_persistence.py" = ["I001"]
"tests/test_scoring_persistence.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nerve_center"]
