name: Issue 60 provider observability patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/issue-60-observability-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply bounded observability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Adapter-level transport truth: distinguish cache reuse from network work.
          replace_once(
              "src/nerve_center/discovery/search.py",
              '        self.last_provider = ""\n        self.last_provider_fallback_used = False\n',
              '        self.last_provider = ""\n        self.last_provider_fallback_used = False\n        self.last_search_transport = ""\n',
          )
          replace_once(
              "src/nerve_center/discovery/search.py",
              '    ) -> list[SearchResult]:\n        builtin_query = _board_native_query(query, "builtin.com")\n',
              '    ) -> list[SearchResult]:\n        self.last_provider = ""\n        self.last_provider_fallback_used = False\n        self.last_search_transport = ""\n        builtin_query = _board_native_query(query, "builtin.com")\n',
          )
          replace_once(
              "src/nerve_center/discovery/search.py",
              '        else:\n            provider, cache_provider, cached = self._select_public_provider(\n                query, result_scope\n            )\n            self.last_provider = provider\n            self.last_provider_fallback_used = provider == self.fallback_provider\n\n        if cached is not None and cached.get("status") == "succeeded":\n            return _rehydrate_cached_results(\n',
              '        else:\n            try:\n                provider, cache_provider, cached = self._select_public_provider(\n                    query, result_scope\n                )\n            except SearchChallengeError:\n                self.last_search_transport = "cooldown"\n                raise\n            self.last_provider = provider\n            self.last_provider_fallback_used = provider == self.fallback_provider\n\n        if cached is not None and cached.get("status") == "succeeded":\n            self.last_search_transport = "cache"\n            return _rehydrate_cached_results(\n',
          )
          replace_once(
              "src/nerve_center/discovery/search.py",
              '        else:\n            search_url = "https://html.duckduckgo.com/html/"\n            params = {"q": query, "source": "web"}\n        try:\n            response = await self.fetcher.get(\n',
              '        else:\n            search_url = "https://html.duckduckgo.com/html/"\n            params = {"q": query, "source": "web"}\n        self.last_search_transport = "network"\n        try:\n            response = await self.fetcher.get(\n',
          )

          # Record every compiled public-search call, including deepening failback queries.
          replace_once(
              "src/nerve_center/plugins/job_scout/discovery_quality.py",
              '        self.failback_reason = ""\n        self.warnings: list[str] = []\n\n    async def search(self, _legacy_query: str) -> Any:\n',
              '''        self.failback_reason = ""\n        self.warnings: list[str] = []\n        self.search_attempt_evidence: list[dict[str, Any]] = []\n\n    @property\n    def last_provider(self) -> str:\n        return str(getattr(self.delegate, "last_provider", "") or "")\n\n    @property\n    def last_provider_fallback_used(self) -> bool:\n        return bool(getattr(self.delegate, "last_provider_fallback_used", False))\n\n    @property\n    def last_search_transport(self) -> str:\n        return str(getattr(self.delegate, "last_search_transport", "") or "")\n\n    def _record_search_attempt(\n        self,\n        query: str,\n        status: str,\n        results: list[SearchResult] | None = None,\n    ) -> None:\n        self.search_attempt_evidence.append(\n            {\n                "query": query,\n                "search_provider": self.last_provider,\n                "search_provider_fallback_used": self.last_provider_fallback_used,\n                "search_transport": self.last_search_transport,\n                "status": status,\n                "result_count": len(results or []),\n            }\n        )\n\n    async def search(self, _legacy_query: str) -> Any:\n''',
          )
          replace_once(
              "src/nerve_center/plugins/job_scout/discovery_quality.py",
              '''            try:\n                results = await self.delegate.search(query)\n            except (RuntimeError, SearchChallengeError) as error:\n                if index == 0:\n                    raise\n                self.warnings.append(f"employer query failback deferred: {error}")\n                break\n            self.search_requests_completed += 1\n''',
              '''            try:\n                results = await self.delegate.search(query)\n            except (RuntimeError, SearchChallengeError) as error:\n                self._record_search_attempt(\n                    query,\n                    "challenged" if isinstance(error, SearchChallengeError) else "failed",\n                )\n                if index == 0:\n                    raise\n                self.warnings.append(f"employer query failback deferred: {error}")\n                break\n            self._record_search_attempt(query, "succeeded", list(results))\n            self.search_requests_completed += 1\n''',
          )
          replace_once(
              "src/nerve_center/plugins/job_scout/discovery_quality.py",
              '''    async def search_references(self, _legacy_query: str) -> Any:\n        method = getattr(self.delegate, "search_references", self.delegate.search)\n        self.queries_attempted.append(self.queries[0])\n        results = await method(self.queries[0])\n        self.search_requests_completed += 1\n        return results\n''',
              '''    async def search_references(self, _legacy_query: str) -> Any:\n        method = getattr(self.delegate, "search_references", self.delegate.search)\n        query = self.queries[0]\n        self.queries_attempted.append(query)\n        try:\n            results = await method(query)\n        except (RuntimeError, SearchChallengeError) as error:\n            self._record_search_attempt(\n                query,\n                "challenged" if isinstance(error, SearchChallengeError) else "failed",\n            )\n            raise\n        self._record_search_attempt(query, "succeeded", list(results))\n        self.search_requests_completed += 1\n        return results\n''',
          )
          replace_once(
              "src/nerve_center/plugins/job_scout/discovery_quality.py",
              '            "queries_attempted": compiled_adapter.queries_attempted,\n            "query_failback_reason": compiled_adapter.failback_reason,\n',
              '            "queries_attempted": compiled_adapter.queries_attempted,\n            "search_attempt_evidence": compiled_adapter.search_attempt_evidence,\n            "query_failback_reason": compiled_adapter.failback_reason,\n',
          )

          # The runtime cycle override predated the fallback counter. Keep aggregate accounting truthful.
          replace_once(
              "src/nerve_center/plugins/job_scout/location_discovery.py",
              '            "search_requests_failed": 0,\n            "search_results_returned": 0,\n',
              '            "search_requests_failed": 0,\n            "search_provider_fallbacks": 0,\n            "search_results_returned": 0,\n',
          )
          replace_once(
              "src/nerve_center/plugins/job_scout/location_discovery.py",
              '                    "search_requests_failed",\n                    "search_results_returned",\n',
              '                    "search_requests_failed",\n                    "search_provider_fallbacks",\n                    "search_results_returned",\n',
          )

          # Expose run-scoped, flattened public-search evidence through the existing audit endpoint.
          bootstrap = Path("src/nerve_center/plugins/job_scout/bootstrap.py")
          text = bootstrap.read_text(encoding="utf-8")
          marker = '\n\ndef _register_discovery_learning_routes(\n'
          if marker not in text:
              raise RuntimeError("bootstrap route anchor missing")
          helper = '''\n\ndef _recent_public_search_attempt_evidence(\n    learning: DiscoveryQualityRepository,\n    *,\n    run_id: str | None = None,\n    limit: int = 128,\n) -> list[dict[str, object]]:\n    """Return bounded per-search provider/cache evidence, optionally scoped to one run."""\n\n    scan_limit = max(limit * 2, 64)\n    evidence: list[dict[str, object]] = []\n    with learning.database.session() as session:\n        statement = select(\n            StrategyAttemptModel,\n            DiscoveryStrategyModel,\n        ).join(\n            DiscoveryStrategyModel,\n            StrategyAttemptModel.strategy_id == DiscoveryStrategyModel.id,\n        )\n        if run_id is not None:\n            statement = statement.where(StrategyAttemptModel.run_id == run_id)\n        rows = session.execute(\n            statement.order_by(StrategyAttemptModel.finished_at.desc()).limit(scan_limit)\n        ).all()\n        for attempt, strategy in rows:\n            detail = attempt.detail if isinstance(attempt.detail, dict) else {}\n            events = detail.get("search_attempt_evidence")\n            if not isinstance(events, list):\n                continue\n            dimensions = (\n                strategy.dimensions if isinstance(strategy.dimensions, dict) else {}\n            )\n            for event in events:\n                if not isinstance(event, dict):\n                    continue\n                evidence.append(\n                    {\n                        "attempt_id": attempt.id,\n                        "run_id": attempt.run_id,\n                        "strategy_id": attempt.strategy_id,\n                        "cycle": attempt.cycle,\n                        "phase": attempt.phase,\n                        "finished_at": attempt.finished_at,\n                        "hypothesis_family": dimensions.get(\n                            "hypothesis_family", "legacy"\n                        ),\n                        "anchor": dimensions.get("anchor", ""),\n                        "location": dimensions.get("location", ""),\n                        "query": str(event.get("query") or ""),\n                        "search_provider": str(event.get("search_provider") or ""),\n                        "search_provider_fallback_used": bool(\n                            event.get("search_provider_fallback_used", False)\n                        ),\n                        "search_transport": str(\n                            event.get("search_transport") or ""\n                        ),\n                        "status": str(event.get("status") or ""),\n                        "result_count": max(int(event.get("result_count") or 0), 0),\n                    }\n                )\n                if len(evidence) >= limit:\n                    return evidence\n    return evidence\n'''
          bootstrap.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")
          replace_once(
              "src/nerve_center/plugins/job_scout/bootstrap.py",
              '''        audit["reference_attempt_evidence"] = _recent_reference_attempt_evidence(\n            learning,\n            run_id=run_id,\n        )\n        return audit\n''',
              '''        audit["reference_attempt_evidence"] = _recent_reference_attempt_evidence(\n            learning,\n            run_id=run_id,\n        )\n        audit["public_search_attempt_evidence"] = (\n            _recent_public_search_attempt_evidence(\n                learning,\n                run_id=run_id,\n            )\n        )\n        return audit\n''',
          )

          # Extend deterministic provider tests with cache-vs-network evidence.
          replace_once(
              "tests/test_public_search_fallback.py",
              '    assert adapter.last_provider_fallback_used is False\n    assert cache.get("public_search_provider_health:v1", "duckduckgo_html") is not None\n',
              '    assert adapter.last_provider_fallback_used is False\n    assert adapter.last_search_transport == "network"\n    assert cache.get("public_search_provider_health:v1", "duckduckgo_html") is not None\n',
          )
          replace_once(
              "tests/test_public_search_fallback.py",
              '    assert fresh_adapter.last_provider_fallback_used is True\n    assert [item.url for item in results] == ["https://example.com/careers"]\n',
              '    assert fresh_adapter.last_provider_fallback_used is True\n    assert fresh_adapter.last_search_transport == "network"\n    assert [item.url for item in results] == ["https://example.com/careers"]\n',
          )
          test_fallback = Path("tests/test_public_search_fallback.py")
          test_fallback.write_text(
              test_fallback.read_text(encoding="utf-8")
              + '''\n\ndef test_nonempty_primary_cache_remains_reusable_during_provider_cooldown() -> None:\n    cache = MemorySearchCache()\n    query = "cached employer query"\n    cache.put(\n        "duckduckgo_html:5:references",\n        query,\n        {\n            "status": "succeeded",\n            "results": [\n                {\n                    "title": "Cached Employer Careers",\n                    "url": "https://cached.example/careers",\n                    "snippet": "",\n                    "classification": "company_career",\n                    "domain": "cached.example",\n                }\n            ],\n        },\n    )\n    cache.put(\n        "public_search_provider_health:v1",\n        "duckduckgo_html",\n        {"status": "challenged", "message": "cooling down"},\n    )\n\n    def handler(_request: httpx.Request) -> httpx.Response:\n        raise AssertionError("cache reuse must not issue a network request")\n\n    fetcher, client = _fetcher(handler)\n    adapter = PublicWebSearchAdapter(cache, fetcher=fetcher, max_results=5)  # type: ignore[arg-type]\n    results = asyncio.run(adapter.search_references(query))\n    asyncio.run(client.aclose())\n\n    assert [item.url for item in results] == ["https://cached.example/careers"]\n    assert adapter.last_provider == "duckduckgo_html"\n    assert adapter.last_provider_fallback_used is False\n    assert adapter.last_search_transport == "cache"\n''',
              encoding="utf-8",
          )

          # Audit helper is run-scoped and preserves one row per actual search call.
          replace_once(
              "tests/test_job_scout_reference_audit.py",
              'from nerve_center.plugins.job_scout.bootstrap import _recent_reference_attempt_evidence\n',
              'from nerve_center.plugins.job_scout.bootstrap import (\n    _recent_public_search_attempt_evidence,\n    _recent_reference_attempt_evidence,\n)\n',
          )
          audit_test = Path("tests/test_job_scout_reference_audit.py")
          audit_test.write_text(
              audit_test.read_text(encoding="utf-8")
              + '''\n\ndef test_public_search_attempt_evidence_is_run_scoped_and_transport_explicit(\n    tmp_path: Path,\n) -> None:\n    learning = _learning(tmp_path)\n    strategy = learning.ensure_strategy(\n        {\n            "kind": "public_search",\n            "hypothesis_family": "local_employer_deepen",\n            "anchor": "Example Systems",\n            "location": "Example Metro, NC",\n            "source_domain": "web",\n        },\n        origin="fixture",\n    )\n    learning.record_attempt(\n        "run-search",\n        2,\n        strategy.id,\n        "deepen",\n        StrategyOutcome(\n            detail={\n                "search_attempt_evidence": [\n                    {\n                        "query": '\"Example Systems\" careers',\n                        "search_provider": "duckduckgo_html",\n                        "search_provider_fallback_used": False,\n                        "search_transport": "cache",\n                        "status": "succeeded",\n                        "result_count": 3,\n                    },\n                    {\n                        "query": '\"Example Systems\" official careers',\n                        "search_provider": "bing_html",\n                        "search_provider_fallback_used": True,\n                        "search_transport": "network",\n                        "status": "succeeded",\n                        "result_count": 2,\n                    },\n                ]\n            }\n        ),\n    )\n    learning.record_attempt(\n        "run-other",\n        3,\n        strategy.id,\n        "deepen",\n        StrategyOutcome(\n            detail={\n                "search_attempt_evidence": [\n                    {\n                        "query": "other",\n                        "search_provider": "duckduckgo_html",\n                        "search_provider_fallback_used": False,\n                        "search_transport": "network",\n                        "status": "succeeded",\n                        "result_count": 1,\n                    }\n                ]\n            }\n        ),\n    )\n\n    rows = _recent_public_search_attempt_evidence(\n        learning,\n        run_id="run-search",\n        limit=64,\n    )\n\n    assert len(rows) == 2\n    assert {row["run_id"] for row in rows} == {"run-search"}\n    assert [row["search_transport"] for row in rows] == ["cache", "network"]\n    assert [row["search_provider"] for row in rows] == [\n        "duckduckgo_html",\n        "bing_html",\n    ]\n    assert rows[1]["search_provider_fallback_used"] is True\n''',
              encoding="utf-8",
          )

          # Guard the subclass telemetry copy against future counter drift.
          Path("tests/test_job_scout_location_fallback_telemetry.py").write_text(
              '''import inspect\n\nfrom nerve_center.plugins.job_scout.location_discovery import (\n    LocationAwareJobScoutDiscoveryLoop,\n)\n\n\ndef test_location_cycle_carries_search_provider_fallback_counter() -> None:\n    source = inspect.getsource(LocationAwareJobScoutDiscoveryLoop.cycle)\n    assert source.count('"search_provider_fallbacks"') >= 2\n''',
              encoding="utf-8",
          )

          # Refresh handoffs for closed #57 and active #60 without reopening settled policy.
          handoff = Path("refs/handoffs/currentHandoff.md")
          handoff_text = handoff.read_text(encoding="utf-8")
          checkpoint = '''## 2026-09-17 - Issue #57 accepted; provider evidence follow-up #60\n\nExact-runtime run `8b646b11-d5ba-4725-991c-5eb2eb36c36a` completed successfully via planned `admission_draining` on Git `5155a82099c516eb403630fa72d30b297062a154` with checkout-source identity proven. It used 55 / 150 requests and 5 / 30 LLM calls, completed five full scores with zero failures, completed 31 / 33 source scans, returned 73 public-search results, inspected 319 postings, retained four opportunities, and resolved three career sources.\n\nThe decisive Issue #57 acceptance condition is now satisfied: six normalized civic/PDF-OCR `local_employer_deepen` strategies executed through ordinary location-free employer-career search, and the attachment-backed `City of High Point` hypothesis returned public career results and resolved three career sources. Issue #57 is closed as completed.\n\nThe run reported `search_provider_fallbacks=0`, but audit of the runtime path exposed an accounting/observability gap rather than evidence for another discovery-policy change. `LocationAwareJobScoutDiscoveryLoop.cycle` predated the fallback counter and did not aggregate it, and the live report could not distinguish reusable search-cache results from fresh provider transport. Issue #60 owns the bounded correction: preserve DDG primary/Bing fallback behavior, expose one run-scoped evidence row per actual public-search call with provider/fallback/cache-vs-network status, and carry fallback counts through the location-aware runtime cycle.\n\nDo not retune search wording, scoring, scheduler weights, cooldown duration, extraction rules, or request caps from this evidence. The low-intent `Human-Centered Design company` Wikipedia references are a separate relevance-quality observation if they persist.\n\n'''
          if "# Current Handoff\n" not in handoff_text:
              raise RuntimeError("current handoff title anchor missing")
          handoff_text = handoff_text.replace(
              "# Current Handoff\n",
              "# Current Handoff\n\n" + checkpoint,
              1,
          )
          handoff_text = handoff_text.replace(
              "- Issue #57 remains open. Do not close it until current-run evidence shows the local employer/alias acquisition path produces usable hypotheses that proceed through ordinary company/career discovery.",
              "- Issue #57 is closed as completed from exact-runtime run `8b646b11-d5ba-4725-991c-5eb2eb36c36a`. Issue #60 is the active bounded provider/cache observability follow-up.",
              1,
          )
          start = handoff_text.index("## Next bounded slice")
          end = handoff_text.index("## Required Reads For Next Slice", start)
          next_slice = '''## Next bounded slice\n\nIssue #60 is the only remaining Job Scout acceptance follow-up before returning to staged Code Shop Issue #54. The implementation must remain observability/accounting-only:\n\n1. preserve DuckDuckGo primary and Bing public-HTML fallback semantics exactly;\n2. expose current-run `public_search_attempt_evidence` with query, provider, fallback flag, cache-vs-network transport, status, and result count for every actual search call, including employer deepening failback queries;\n3. aggregate `search_provider_fallbacks` through the location-aware runtime cycle;\n4. keep successful non-empty primary cache reuse valid during provider cooldown;\n5. add no third provider and no same-query provider retry.\n\nAfter clean exact-head CI, run one isolated five-minute gate only if a fresh local run is available. Audit the new `discovery_audit.public_search_attempt_evidence`: after any provider challenge, every later search must be explainable as cache reuse, DDG network, Bing fallback, or provider cooldown. If an uncached post-challenge search executes, require `bing_html` with `search_provider_fallback_used=true` and matching aggregate fallback accounting. If all later searches are cache hits, record that truthfully rather than forcing transport solely to make the counter nonzero.\n\nKeep Issue #60 open until that live evidence is available. Code Shop Issue #54 remains staged immediately behind it.\n\n'''
          handoff.write_text(handoff_text[:start] + next_slice + handoff_text[end:], encoding="utf-8")

          Path("refs/handoffs/next-dev-prompt.md").write_text(
              '''---\ntype: Development Prompt\ntitle: Next Development Prompt\ndescription: Ready-to-use prompt for the Job Scout provider/cache evidence acceptance gate.\nstatus: stable\ntags: [nerve-center, handoff, job-scout, discovery, live-test]\n---\n# Next Development Prompt\n\nContinue Issue #60 directly on `dev`. Do not create a feature branch or PR. Issue #57 is closed as completed. Do not promote `qa` or `main`.\n\nStart with:\n\n```powershell\npython scripts/agent_context.py --focus "job scout provider cache evidence DDG Bing fallback acceptance" --issue 60\n```\n\nUse packet-first/progressive loading. Read this handoff, `refs/handoffs/currentHandoff.md`, Issue #60, and only source-catalog matches needed for provider/cache evidence. Do not reread repository history.\n\nThe accepted source run is `8b646b11-d5ba-4725-991c-5eb2eb36c36a` from exact Git `5155a82099c516eb403630fa72d30b297062a154`. It completed planned `admission_draining` with 55 requests, five LLM calls, five successful full scores, 73 public-search results, three career sources, 319 postings inspected, and four retained opportunities. Six normalized attachment-backed employer hypotheses executed through ordinary career discovery, satisfying and closing Issue #57.\n\nIssue #60 exists because that report could not distinguish provider cache reuse from network transport and the location-aware runtime cycle omitted the `search_provider_fallbacks` aggregate counter. The bounded fix records per-search provider/cache evidence and restores truthful fallback aggregation without changing provider policy.\n\nAfter exact-head CI is green, run one isolated five-minute gate:\n\n```powershell\ngit pull\n\n.\\.venv\\Scripts\\python.exe scripts\\run_job_scout_live.py `\n  --duration-seconds 300 `\n  --max-requests 150 `\n  --max-llm-calls 30 `\n  --score-limit 10 `\n  --score-failure-limit 5\n```\n\nAudit `discovery_audit.public_search_attempt_evidence` for the new run. Verify runtime identity first. Then verify each actual public search records query, provider, fallback flag, transport (`cache`, `network`, or `cooldown`), status, and result count. After any DDG challenge, later searches must be explainable from those rows. If an uncached post-challenge call occurs, require Bing fallback and exact aggregate fallback accounting. If later calls are all reusable cache hits, accept that truthful outcome and do not force network work just to exercise Bing.\n\nDo not change search semantics, extraction, scoring, scheduler weights, cooldown duration, request caps, or add a third provider from this gate. Keep Issue #60 open until live evidence is accepted. Code Shop Issue #54 is next after #60.\n''',
              encoding="utf-8",
          )
          PY
      - name: Refresh deterministic indexes
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate targeted slice
        run: |
          ruff check src/nerve_center/discovery/search.py src/nerve_center/plugins/job_scout/discovery_quality.py src/nerve_center/plugins/job_scout/location_discovery.py src/nerve_center/plugins/job_scout/bootstrap.py tests/test_public_search_fallback.py tests/test_job_scout_reference_audit.py tests/test_job_scout_location_fallback_telemetry.py
          pytest tests/test_public_search_fallback.py tests/test_job_scout_reference_audit.py tests/test_job_scout_location_fallback_telemetry.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
      - name: Validate full Python suite
        run: pytest
      - name: Commit clean helper-free result to dev
        run: |
          git rm .github/workflows/issue-60-observability-patch.yml
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose public search provider cache evidence"
          git push origin HEAD:dev
