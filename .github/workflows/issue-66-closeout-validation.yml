name: Issue 66 closeout validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Refresh deterministic artifacts
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate repository contracts
        run: |
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "job scout reflection career intent issue 66" --issue 66 --check
          ruff check .
          pytest
      - name: Build desktop web
        working-directory: desktop
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit generated artifacts and success marker
        shell: bash
        run: |
          printf 'validated_head=%s\n' "$GITHUB_SHA" > .github/issue-66-validation-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs .github/issue-66-validation-success.txt
          git commit -m "chore: record issue 66 closeout validation"
          git push origin HEAD:dev
