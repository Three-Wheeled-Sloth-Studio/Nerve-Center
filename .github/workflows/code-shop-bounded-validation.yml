name: Code Shop bounded validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Refresh Code Shop generated indexes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Refresh deterministic discovery artifacts
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate refs and context
        run: |
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "Code Shop safe orchestration foundation project registry checkout authority execution host" --issue 54
          python scripts/agent_context.py --focus "job scout scoring domain fit" --check
      - name: Lint
        run: ruff check .
      - name: Targeted tests
        run: pytest tests/test_code_shop.py tests/test_api.py tests/test_module_registry.py tests/test_module_contracts.py
      - name: Full Python tests
        run: pytest
      - name: Commit refreshed generated artifacts and remove helper
        shell: bash
        run: |
          rm .github/workflows/code-shop-bounded-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Refresh Code Shop generated indexes"
            git push origin HEAD:dev
          fi
