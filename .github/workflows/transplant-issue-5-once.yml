name: Transplant Issue 5 Once

on:
  push:
    branches:
      - agent/issue-5-desktop-clean

permissions:
  contents: write

jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-5-desktop-clean
          fetch-depth: 0
      - name: Copy the Issue 5 delta
        run: |
          git fetch origin agent/issue-5-desktop:refs/remotes/origin/agent/issue-5-desktop
          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [
              '.github/workflows/ci.yml',
              'README.md',
              'desktop/index.html',
              'desktop/package.json',
              'desktop/tsconfig.json',
              'desktop/vite.config.ts',
              'desktop/src/main.tsx',
              'desktop/src/App.tsx',
              'desktop/src/api.ts',
              'desktop/src/styles.css',
              'desktop/src/types.ts',
              'desktop/src/vite-env.d.ts',
              'desktop/src-tauri/Cargo.toml',
              'desktop/src-tauri/build.rs',
              'desktop/src-tauri/tauri.conf.json',
              'desktop/src-tauri/capabilities/default.json',
              'desktop/src-tauri/src/lib.rs',
              'desktop/src-tauri/src/main.rs',
              'pyproject.toml',
              'refs/handoffs/desktop-review-application-tracking.md',
              'src/nerve_center/__init__.py',
              'src/nerve_center/api/app.py',
              'src/nerve_center/api/schemas.py',
              'src/nerve_center/applications/__init__.py',
              'src/nerve_center/applications/api.py',
              'src/nerve_center/applications/models.py',
              'src/nerve_center/discovery/plugin.py',
              'src/nerve_center/persistence/application_tables.py',
              'src/nerve_center/persistence/applications.py',
              'src/nerve_center/persistence/database.py',
              'src/nerve_center/persistence/scoring.py',
              'tests/test_applications.py',
          ]
          for item in paths:
              content = subprocess.check_output(
                  ['git', 'show', f'origin/agent/issue-5-desktop:{item}']
              )
              target = Path(item)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          Path('.github/workflows/transplant-issue-5-once.yml').unlink()
          PY
      - name: Commit clean desktop increment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add desktop review and application tracking'
          git push origin HEAD:agent/issue-5-desktop-clean
