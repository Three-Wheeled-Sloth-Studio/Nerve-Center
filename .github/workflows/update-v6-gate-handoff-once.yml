name: Update v6 gate handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-v6-gate-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Record v6 acquisition gate and next acceptance slice
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("refs/handoffs/currentHandoff.md")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r"- The local-acquisition persistence checkpoint is `5240bf5f820772277dfacba5a14c6ed6064c393a`\..*?\n",
              "- The current acquisition-lane checkpoint is `857bbfae2a2822039956ffabcb336dac3b400a2c`. It preserves one company revisit while allowing bounded `local_employer`, evidence-backed `local_employer_deepen`, and first-pass `regional_alias_probe` reservations to displace excess revisit crowding. It also rejects shallow HTML navigation/social labels from employer-list hypotheses while leaving structured and PDF/OCR extraction intact. Targeted validation passed in workflow `35243110817`; full CI is required before the next live gate.\n",
              text,
              count=1,
          )

          item19 = "19. changed local/regional query semantics advance the durable market-reference revision, and canonical public-search dedup prefers that current revision so stale strategy identities cannot mask new behavior behind prior-run cooldown history.\n"
          item20 = "20. reserved acquisition lanes may displace excess company revisits while preserving one revisit, and HTML employer-list parsing rejects shallow navigation/social labels before they become employer hypotheses.\n"
          if item20 not in text:
              if item19 not in text:
                  raise SystemExit("completed behavior insertion point not found")
              text = text.replace(item19, item19 + item20, 1)

          implementation = "- `857bbfae2a2822039956ffabcb336dac3b400a2c`: reserved acquisition lanes can displace excess company revisits while preserving one revisit; HTML employer-list parsing rejects shallow navigation/social labels; regression coverage and deterministic source catalog refreshed.\n"
          checkpoint = "- `5240bf5f820772277dfacba5a14c6ed6064c393a`: `market_reference_v6`, current-revision canonical preference for local/regional public-search identities, cooldown regression coverage, and refreshed deterministic source catalog.\n"
          if implementation not in text:
              if checkpoint not in text:
                  raise SystemExit("implementation insertion point not found")
              text = text.replace(checkpoint, checkpoint + implementation, 1)

          gate = '''## 30-minute v6 acquisition gate

Run `14011cec-0ee2-4d63-b593-0dc7f318c832` completed successfully at planned `admission_draining` after the v6 identity correction:

- 133 / 500 requests;
- 43 / 80 LLM calls;
- duration and planned wind-down both completed without budget exhaustion;
- 21 current-run `local_employer` reference attempts across the bounded local market family;
- employer-reference pages were inspected and evidence-backed employer hypotheses were produced;
- the High Point civic `2022 Largest Employers` PDF was parsed through the existing bounded OCR path and yielded 12 employer-name hypotheses;
- all eight fresh `market_reference_v6` `regional_alias_probe` strategies remained at zero attempts;
- newly available `local_employer_deepen` hypotheses also received no current-run attempt.

This proves the v6 persistence/canonicalization correction worked for `local_employer`: the acquisition query/reference/extraction path is alive. It also isolates the next scheduler defect. In a four-slot wave, reserved non-company acquisition lanes could not displace any `company_revisit`, so multiple high-weight revisits could occupy the remaining capacity after local-employer reservation and starve both employer deepening and regional first-pass coverage.

The same run exposed an HTML extraction precision defect. One public Major Employers page produced 12 hypotheses from subordinate navigation/section labels such as `Strategic Location`, `Higher Education`, `Facebook`, and `LinkedIn`. Those are not accepted as employer truth. The working civic PDF/OCR path remains valid evidence and must not be weakened.

The bounded correction at `857bbfae...` allows a reserved non-company acquisition lane to replace an excess company revisit only when more than one revisit is selected, preserving exactly one revisit lane. Regression coverage proves a four-slot wave can contain one company revisit plus `local_employer`, evidence-backed `local_employer_deepen`, and first-pass `regional_alias_probe`. HTML extraction now rejects shallow subordinate headings and generic social-navigation labels while structured JSON and PDF/OCR paths remain unchanged.

'''
          marker = "## Regional saturation checkpoint\n"
          if "## 30-minute v6 acquisition gate" not in text:
              if marker not in text:
                  raise SystemExit("runtime gate insertion point not found")
              text = text.replace(marker, gate + marker, 1)

          next_slice = '''## Next bounded slice

Pull `dev` after full CI is green, then rerun the same isolated 30-minute gate. Do not run another long soak yet.

```powershell
.\\.venv\\Scripts\\python.exe scripts\\run_job_scout_live.py `
  --duration-seconds 1800 `
  --max-requests 500 `
  --max-llm-calls 80 `
  --score-limit 25 `
  --score-failure-limit 5
```

Audit only the new current run:

1. verify at least one fresh `regional_alias_probe` executes through its first-pass protected lane;
2. verify at least one evidence-backed `local_employer_deepen` hypothesis executes while a company revisit is still preserved;
3. verify HTML employer-list extraction no longer promotes shallow section/navigation/social labels as employer hypotheses;
4. verify the working PDF/OCR employer path remains intact;
5. if employer deepening executes, verify it enters ordinary location-free official-career resolution and records truthful company/source/posting evidence;
6. if the regional and deepening lanes execute but produce no usable downstream evidence, diagnose those paths next rather than retuning general scoring or search allocation;
7. only after those acquisition/deepening paths are alive should another long soak be considered.

Keep Issue #57 open. Do not weaken the 24-hour cooldown, retune general scoring, or add named company/city/region exceptions without new evidence.

'''
          pattern = r"## Next bounded slice\n.*?(?=Code Shop Issue #54)"
          text, count = re.subn(pattern, next_slice, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("next bounded slice replacement point not found")

          text = text.replace(
              "local-acquisition correction, and current short-gate questions.",
              "completed v6 gate evidence, acquisition-lane correction, and current short-gate questions.",
          )
          text = text.replace(
              "only `select_strategies` and directly related scheduler/cooldown symbols if the short gate shows local strategies are not executing.",
              "only `select_strategies`, reservation logic, and directly related scheduler/cooldown symbols if the short gate shows regional/deepening lanes are not executing.",
          )
          text = text.replace(
              'python scripts/agent_context.py --focus "job scout local employer regional alias acquisition employer candidates" --issue 57',
              'python scripts/agent_context.py --focus "job scout local employer deepening regional alias reserved acquisition lanes" --issue 57',
          )
          path.write_text(text, encoding="utf-8")
      - name: Remove one-shot helper
        run: git rm .github/workflows/update-v6-gate-handoff-once.yml
      - name: Regenerate OKF indexes
        run: python refs/tools/generate_okf_indexes.py
      - name: Commit handoff and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/handoffs/currentHandoff.md refs/handoffs/index.md refs/implementation/index.md refs/planning/index.md refs/product/index.md refs/testing/index.md
          git commit -m "Record v6 acquisition gate and reservation fix"
          git push origin HEAD:dev
