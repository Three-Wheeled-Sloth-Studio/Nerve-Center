name: Update v6 gate handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-v6-gate-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Record v6 acquisition gate and next acceptance slice
        run: python -c "import base64;exec(base64.b64decode(''))"
