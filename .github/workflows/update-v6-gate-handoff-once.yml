name: Update v6 gate handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-v6-gate-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Record v6 acquisition gate and next acceptance slice
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Remove one-shot helper
        run: git rm .github/workflows/update-v6-gate-handoff-once.yml
      - name: Regenerate OKF indexes
        run: python refs/tools/generate_okf_indexes.py
      - name: Commit handoff and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/handoffs/currentHandoff.md refs/handoffs/index.md refs/implementation/index.md refs/planning/index.md refs/product/index.md refs/testing/index.md
          git commit -m "Record v6 acquisition gate and reservation fix"
          git push origin HEAD:dev
