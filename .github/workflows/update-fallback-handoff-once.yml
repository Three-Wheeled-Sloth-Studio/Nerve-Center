name: Update fallback handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-fallback-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install index dependency
        run: python -m pip install pyyaml
      - name: Update current handoff
        run: python .github/update_fallback_handoff_once.py
      - name: Remove helper and refresh OKF indexes
        run: |
          git rm -f .github/update_fallback_handoff_once.py .github/workflows/update-fallback-handoff-once.yml
          python refs/tools/generate_okf_indexes.py
      - name: Commit handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record public search fallback checkpoint"
          git push origin dev
