name: Refresh source catalog once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refresh-source-catalog-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Regenerate deterministic source catalog
        run: python refs/tools/generate_source_catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/implementation/.sourceCatalogShards refs/implementation/sourceCatalog/index.yaml
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Refresh source catalog for local acquisition queries"
          git push origin HEAD:dev
