name: Final Attention handoff refresh

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh final Attention handoff indexes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Refresh and validate
        run: |
          python refs/tools/generate_okf_indexes.py
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "manager morning summary completed blocked failed degraded comparison attention" --issue 62
      - name: Commit refreshed indexes and remove helper
        run: |
          rm .github/workflows/final-attention-handoff-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh final Attention handoff indexes"
          git push origin HEAD:dev
