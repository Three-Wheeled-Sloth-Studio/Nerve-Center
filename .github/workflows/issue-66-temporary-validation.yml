name: Issue 66 temporary validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Refresh deterministic discovery artifacts
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Focused validation
        run: |
          ruff check src/nerve_center/plugins/job_scout/query_portfolio.py src/nerve_center/plugins/job_scout/discovery_quality.py tests/test_job_scout_query_portfolio.py
          pytest -q tests/test_job_scout_query_portfolio.py
          python refs/tools/validate_refs.py --mode initialized
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- refs/implementation refs/index.md; then
            echo "No generated artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/implementation refs/index.md
          git commit -m "chore: refresh deterministic discovery artifacts"
          git push origin HEAD:dev
