name: Code Shop closeout validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message != 'Refresh Code Shop closeout artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Refresh generated discovery artifacts
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate refs and source discovery
        run: |
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "manager attention review queue dependency blocking Code Shop escalation" --issue 61
          python scripts/agent_context.py --focus "job scout scoring domain fit" --check
      - name: Lint and Python tests
        run: |
          ruff check .
          python scripts/build_windows_backend.py --dry-run
          pytest
      - name: Desktop web
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Desktop Rust
        run: cargo check --tests --message-format=short --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit generated artifacts and remove helper
        shell: bash
        run: |
          rm .github/workflows/code-shop-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Refresh Code Shop closeout artifacts"
            git push origin HEAD:dev
          fi
