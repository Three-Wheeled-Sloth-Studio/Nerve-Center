name: Refresh OKF after handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refresh-okf-after-handoff-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python refs/tools/generate_okf_indexes.py
      - name: Commit clean index
        shell: bash
        run: |
          rm .github/workflows/refresh-okf-after-handoff-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh post-handoff OKF index"
          git push origin dev
