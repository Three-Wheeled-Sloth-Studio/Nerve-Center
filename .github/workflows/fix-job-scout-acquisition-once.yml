name: Fix Job Scout acquisition persistence once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-job-scout-acquisition-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Patch acquisition persistence and provider challenge detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          learning_path = Path("src/nerve_center/plugins/job_scout/discovery_learning.py")
          learning = learning_path.read_text(encoding="utf-8")
          old_helper = '''def _employer_deepening_evidence_is_current(dimensions: dict[str, str]) -> bool:
              if dimensions.get("hypothesis_family") != "local_employer_deepen":
                  return False
              authority = dimensions.get("employer_evidence_authority", "")
              medium = dimensions.get("employer_evidence_medium", "")
              extraction_method = dimensions.get("employer_evidence_extraction_method", "")
              if (
                  authority == "civic_attachment"
                  or medium == "attachment"
                  or extraction_method.startswith(("pdf_", "attachment_"))
              ):
                  return True
              return (
                  dimensions.get("employer_evidence_revision")
                  == EMPLOYER_LANDSCAPE_EVIDENCE_REVISION
              )
          '''.replace("          ", "")
          new_helper = '''def _employer_deepening_evidence_priority(dimensions: dict[str, str]) -> int:
              """Rank equivalent employer hypotheses by evidence semantics freshness."""

              if dimensions.get("hypothesis_family") != "local_employer_deepen":
                  return 0
              authority = dimensions.get("employer_evidence_authority", "")
              medium = dimensions.get("employer_evidence_medium", "")
              extraction_method = dimensions.get("employer_evidence_extraction_method", "")
              if (
                  medium == "attachment"
                  or dimensions.get("employer_evidence_revision")
                  == EMPLOYER_LANDSCAPE_EVIDENCE_REVISION
              ):
                  return 2
              if (
                  authority == "civic_attachment"
                  or extraction_method.startswith(("pdf_", "attachment_"))
              ):
                  return 1
              return 0


          def _employer_deepening_evidence_is_current(dimensions: dict[str, str]) -> bool:
              return _employer_deepening_evidence_priority(dimensions) > 0
          '''.replace("          ", "")
          if old_helper not in learning:
              raise SystemExit("expected employer evidence helper block not found")
          learning = learning.replace(old_helper, new_helper, 1)

          old_canonical = '''        existing = canonical.get(identity)
              model_is_current_semantics = (
                  (
                      model.dimensions.get("hypothesis_family")
                      in {"local_employer", "regional_alias_probe"}
                      and model.dimensions.get("query_revision")
                      == MARKET_REFERENCE_QUERY_REVISION
                  )
                  or _employer_deepening_evidence_is_current(model.dimensions)
              )
              existing_is_current_semantics = (
                  existing is not None
                  and (
                      (
                          existing.dimensions.get("hypothesis_family")
                          in {"local_employer", "regional_alias_probe"}
                          and existing.dimensions.get("query_revision")
                          == MARKET_REFERENCE_QUERY_REVISION
                      )
                      or _employer_deepening_evidence_is_current(existing.dimensions)
                  )
              )
              if (
                  existing is None
                  or (model_is_current_semantics and not existing_is_current_semantics)
                  or (
                      model_is_current_semantics == existing_is_current_semantics
                      and (model.created_at, model.id)
                      < (existing.created_at, existing.id)
                  )
              ):
                  canonical[identity] = model
          '''.replace("          ", "")
          new_canonical = '''        existing = canonical.get(identity)
              model_is_current_semantics = (
                  (
                      model.dimensions.get("hypothesis_family")
                      in {"local_employer", "regional_alias_probe"}
                      and model.dimensions.get("query_revision")
                      == MARKET_REFERENCE_QUERY_REVISION
                  )
                  or _employer_deepening_evidence_is_current(model.dimensions)
              )
              existing_is_current_semantics = (
                  existing is not None
                  and (
                      (
                          existing.dimensions.get("hypothesis_family")
                          in {"local_employer", "regional_alias_probe"}
                          and existing.dimensions.get("query_revision")
                          == MARKET_REFERENCE_QUERY_REVISION
                      )
                      or _employer_deepening_evidence_is_current(existing.dimensions)
                  )
              )
              both_employer_deepening = (
                  existing is not None
                  and model.dimensions.get("hypothesis_family") == "local_employer_deepen"
                  and existing.dimensions.get("hypothesis_family")
                  == "local_employer_deepen"
              )
              model_evidence_priority = _employer_deepening_evidence_priority(
                  model.dimensions
              )
              existing_evidence_priority = (
                  _employer_deepening_evidence_priority(existing.dimensions)
                  if existing is not None
                  else 0
              )
              if (
                  existing is None
                  or (
                      both_employer_deepening
                      and model_evidence_priority > existing_evidence_priority
                  )
                  or (
                      both_employer_deepening
                      and model_evidence_priority == existing_evidence_priority
                      and (model.created_at, model.id)
                      < (existing.created_at, existing.id)
                  )
                  or (
                      not both_employer_deepening
                      and model_is_current_semantics
                      and not existing_is_current_semantics
                  )
                  or (
                      not both_employer_deepening
                      and model_is_current_semantics == existing_is_current_semantics
                      and (model.created_at, model.id)
                      < (existing.created_at, existing.id)
                  )
              ):
                  canonical[identity] = model
          '''.replace("          ", "")
          if old_canonical not in learning:
              raise SystemExit("expected canonical public search block not found")
          learning = learning.replace(old_canonical, new_canonical, 1)
          learning_path.write_text(learning, encoding="utf-8")

          fetching_path = Path("src/nerve_center/discovery/fetching.py")
          fetching = fetching_path.read_text(encoding="utf-8")
          old_markers = '''_CHALLENGE_MARKERS = (
              "captcha",
              "unusual traffic",
              "verify you are human",
              "checking your browser",
              "cloudflare ray id",
              "access denied",
              "security challenge",
          )'''.replace("          ", "")
          new_markers = '''_CHALLENGE_MARKERS = (
              "captcha",
              "unusual traffic",
              "verify you are human",
              "checking your browser",
              "cloudflare ray id",
              "access denied",
              "security challenge",
              "unfortunately, bots use duckduckgo too",
              "bots, we have detected",
              "robot-detected",
              "select all squares containing a duck",
          )'''.replace("          ", "")
          if old_markers not in fetching:
              raise SystemExit("expected challenge marker block not found")
          fetching = fetching.replace(old_markers, new_markers, 1)
          fetching_path.write_text(fetching, encoding="utf-8")

          learning_test_path = Path("tests/test_job_scout_discovery_learning.py")
          learning_test = learning_test_path.read_text(encoding="utf-8")
          regression = r'''

          def test_normalized_attachment_evidence_bypasses_legacy_equivalent_cooldown(
              tmp_path: Path,
          ) -> None:
              learning = JobScoutDiscoveryRepository(_database(tmp_path))
              attempted_at = datetime(2026, 9, 17, 12, 0, tzinfo=UTC)
              legacy = learning.ensure_strategy(
                  {
                      "kind": "public_search",
                      "hypothesis_family": "local_employer_deepen",
                      "anchor": "Example Mobility",
                      "location": "Example, NC",
                      "source_domain": "web",
                      "employer_evidence_authority": "civic_attachment",
                      "employer_evidence_extraction_method": "pdf_ocr_ranked_employers",
                  },
                  origin="public_employer_attachment_evidence",
              )
              learning.record_attempt(
                  "prior-run",
                  1,
                  legacy.id,
                  "deepen",
                  StrategyOutcome(),
                  finished_at=attempted_at,
              )
              normalized = learning.ensure_strategy(
                  {
                      "kind": "public_search",
                      "hypothesis_family": "local_employer_deepen",
                      "anchor": "Example Mobility",
                      "location": "Example Metro Area",
                      "source_domain": "web",
                      "employer_evidence_authority": "civic_attachment",
                      "employer_evidence_medium": "attachment",
                      "employer_evidence_extraction_method": "pdf_ocr_ranked_employers",
                  },
                  origin="public_employer_attachment_evidence",
              )

              selected = learning.select_strategies(
                  "current-run",
                  limit=4,
                  exploration_floor=0.25,
                  revisit_after_seconds=86400,
                  now=attempted_at + timedelta(minutes=5),
              )
              selected_ids = {item.id for item in selected}

              assert normalized.id in selected_ids
              assert legacy.id not in selected_ids
          '''.replace("          ", "")
          if "test_normalized_attachment_evidence_bypasses_legacy_equivalent_cooldown" in learning_test:
              raise SystemExit("deepening regression already present")
          learning_test_path.write_text(learning_test.rstrip() + regression + "\n", encoding="utf-8")

          connector_test_path = Path("tests/test_discovery_connectors.py")
          connector_test = connector_test_path.read_text(encoding="utf-8")
          challenge_test = r'''

          def test_http_fetcher_detects_duckduckgo_bot_challenge() -> None:
              def handler(request: httpx.Request) -> httpx.Response:
                  return httpx.Response(
                      200,
                      text=(
                          "<html><body>Unfortunately, bots use DuckDuckGo too. "
                          "Please complete the following challenge. "
                          "Select all squares containing a duck:</body></html>"
                      ),
                      headers={"content-type": "text/html; charset=UTF-8"},
                      request=request,
                  )

              client = httpx.AsyncClient(transport=httpx.MockTransport(handler))
              response = asyncio.run(
                  HttpFetcher(client=client).get(
                      "https://html.duckduckgo.com/html/",
                      params={"q": "example"},
                  )
              )
              asyncio.run(client.aclose())

              assert response.status_code == 200
              assert response.challenged is True
          '''.replace("          ", "")
          if "test_http_fetcher_detects_duckduckgo_bot_challenge" in connector_test:
              raise SystemExit("DuckDuckGo challenge regression already present")
          connector_test_path.write_text(connector_test.rstrip() + challenge_test + "\n", encoding="utf-8")
          PY
      - name: Refresh deterministic source catalog
        run: python refs/tools/generate_source_catalog.py
      - name: Targeted validation
        run: |
          ruff check src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/discovery/fetching.py tests/test_job_scout_discovery_learning.py tests/test_discovery_connectors.py
          pytest tests/test_job_scout_discovery_learning.py tests/test_discovery_connectors.py
          python refs/tools/generate_source_catalog.py --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/discovery/fetching.py tests/test_job_scout_discovery_learning.py tests/test_discovery_connectors.py refs/architecture/source-catalog.json
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Fix employer evidence canonicalization and DDG challenge detection"
            git push origin dev
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase origin dev
          git rm .github/workflows/fix-job-scout-acquisition-once.yml
          git commit -m "Remove one-shot acquisition fix workflow"
          git push origin dev
