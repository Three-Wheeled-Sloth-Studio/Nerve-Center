name: Fix Job Scout acquisition persistence once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-job-scout-acquisition-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply structural patch
        run: python .github/patch_job_scout_acquisition_once.py
      - name: Refresh deterministic source catalog
        run: python refs/tools/generate_source_catalog.py
      - name: Targeted validation
        run: |
          ruff check src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/discovery/fetching.py tests/test_job_scout_discovery_learning.py tests/test_discovery_connectors.py
          pytest tests/test_job_scout_discovery_learning.py tests/test_discovery_connectors.py
          python refs/tools/generate_source_catalog.py --check
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch_job_scout_acquisition_once.py .github/workflows/fix-job-scout-acquisition-once.yml
          git add -A
          git commit -m "Fix acquisition persistence and provider challenge detection"
          git push origin dev
