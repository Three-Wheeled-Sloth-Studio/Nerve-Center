name: Resource profile bounded validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Refresh resource profile generated artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Refresh generated discovery artifacts
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate refs and source discovery
        run: |
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "resource profiles session overrides CPU memory GPU VRAM concurrency queue network exploration cloud spend authority" --issue 64
          python scripts/agent_context.py --focus "job scout scoring domain fit" --check
      - name: Lint
        run: ruff check .
      - name: Targeted tests
        run: pytest tests/test_resource_profiles.py tests/test_sessions.py tests/test_budget.py tests/test_api.py tests/test_module_permissions.py tests/test_code_shop.py
      - name: Full Python tests
        run: pytest
      - name: Desktop web
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop Rust
        env:
          CARGO_TERM_COLOR: never
        run: cargo check --tests --message-format=short --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit generated artifacts and remove helper
        run: |
          rm .github/workflows/resource-profile-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh resource profile generated artifacts"
          git push origin HEAD:dev
