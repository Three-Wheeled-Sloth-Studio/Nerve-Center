name: Resource profile final handoff refresh

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh final resource profile handoff index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Refresh and validate
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "backup pre-migration snapshot sqlite WAL module data retention verification restore eligibility path containment" --issue 65
      - name: Commit refresh and remove helper
        run: |
          rm .github/workflows/resource-profile-final-handoff-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh final resource profile handoff index"
          git push origin HEAD:dev
