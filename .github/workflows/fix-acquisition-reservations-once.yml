name: Fix acquisition reservations once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-acquisition-reservations-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Patch bounded acquisition behavior
        shell: python
        run: |
          from pathlib import Path

          learning_path = Path("src/nerve_center/plugins/job_scout/discovery_learning.py")
          learning = learning_path.read_text(encoding="utf-8")
          old_reserve = '''    if replace_at is not None:
              selected[replace_at] = candidate
          '''
          new_reserve = '''    if (
              replace_at is None
              and candidate.dimensions.get("kind") != "company_revisit"
          ):
              company_indexes = [
                  index
                  for index, item in enumerate(selected)
                  if item.dimensions.get("kind") == "company_revisit"
              ]
              if len(company_indexes) > 1:
                  replace_at = company_indexes[-1]
          if replace_at is not None:
              selected[replace_at] = candidate
          '''
          if old_reserve not in learning:
              raise SystemExit("reserve replacement target not found")
          learning = learning.replace(old_reserve, new_reserve, 1)
          learning_path.write_text(learning, encoding="utf-8")

          loop_path = Path("src/nerve_center/plugins/job_scout/discovery_loop.py")
          loop = loop_path.read_text(encoding="utf-8")
          old_filter = '''        if (
              not 2 <= len(candidate) <= 100
              or not 1 <= len(candidate.split()) <= 10
              or key in seen
              or key.startswith(("contact ", "learn ", "about "))
              or (tag in {"li", "td"} and len(candidate.split()) > 8)
          ):
          '''
          new_filter = '''        if (
              (level is not None and level < marker_level + 2)
              or not 2 <= len(candidate) <= 100
              or not 1 <= len(candidate.split()) <= 10
              or key in seen
              or key in {
                  "facebook",
                  "instagram",
                  "linkedin",
                  "please follow us",
                  "twitter",
                  "youtube",
              }
              or key.startswith(("contact ", "learn ", "about "))
              or (tag in {"li", "td"} and len(candidate.split()) > 8)
          ):
          '''
          if old_filter not in loop:
              raise SystemExit("employer filter target not found")
          loop = loop.replace(old_filter, new_filter, 1)
          loop_path.write_text(loop, encoding="utf-8")

          learning_test_path = Path("tests/test_job_scout_discovery_learning.py")
          learning_tests = learning_test_path.read_text(encoding="utf-8")
          learning_test = '''

          def test_reserved_acquisition_lanes_can_displace_extra_company_revisits(
              tmp_path: Path,
          ) -> None:
              learning = JobScoutDiscoveryRepository(_database(tmp_path))
              companies = [
                  learning.ensure_strategy(
                      {"kind": "company_revisit", "company_id": f"company-{index}"},
                      origin="known_company",
                      base_weight=4.0,
                  )
                  for index in range(6)
              ]
              local = learning.ensure_strategy(
                  {
                      "kind": "public_search",
                      "hypothesis_family": "local_employer",
                      "anchor": "major employers",
                      "location": "Example, NC",
                      "source_domain": "web",
                      "market_kind": "configured",
                      "market_rank": "0",
                      "query_revision": "market_reference_v6",
                  },
                  origin="market",
                  base_weight=0.2,
              )
              employer = learning.ensure_strategy(
                  {
                      "kind": "public_search",
                      "hypothesis_family": "local_employer_deepen",
                      "anchor": "Example Systems",
                      "location": "Example, NC",
                      "source_domain": "web",
                      "employer_evidence_authority": "civic",
                  },
                  origin="public_employer_landscape_evidence",
                  base_weight=0.2,
              )
              regional = learning.ensure_strategy(
                  {
                      "kind": "public_search",
                      "hypothesis_family": "regional_alias_probe",
                      "anchor": "Example, NC Metro Area",
                      "source_domain": "web",
                      "market_kind": "metro_alias",
                      "market_rank": "1",
                      "query_revision": "market_reference_v6",
                  },
                  origin="public_regional_alias_probe",
                  base_weight=0.2,
              )

              selected = learning.select_strategies(
                  "run-1", limit=4, exploration_floor=0.0
              )
              selected_ids = {item.id for item in selected}

              assert local.id in selected_ids
              assert employer.id in selected_ids
              assert regional.id in selected_ids
              assert sum(
                  item.dimensions.get("kind") == "company_revisit"
                  for item in selected
              ) == 1
              assert selected_ids & {item.id for item in companies}
          '''
          if "def test_reserved_acquisition_lanes_can_displace_extra_company_revisits" not in learning_tests:
              learning_test_path.write_text(
                  learning_tests.rstrip() + learning_test + "\n",
                  encoding="utf-8",
              )

          loop_test_path = Path("tests/test_job_scout_discovery_loop.py")
          loop_tests = loop_test_path.read_text(encoding="utf-8")
          loop_test = '''

          def test_employer_landscape_ignores_navigation_subheadings_and_social_links() -> None:
              names = _extract_employer_landscape_names(
                  """
                  <h1>Major Employers</h1>
                  <h2>In this section</h2>
                  <h2>Strategic Location</h2>
                  <ul><li>Facebook</li><li>LinkedIn</li></ul>
                  <table><tr><td>Example Systems</td></tr></table>
                  <h1>Contact</h1>
                  """
              )

              assert names == ["Example Systems"]
          '''
          if "def test_employer_landscape_ignores_navigation_subheadings_and_social_links" not in loop_tests:
              loop_test_path.write_text(
                  loop_tests.rstrip() + loop_test + "\n",
                  encoding="utf-8",
              )
      - name: Remove one-shot helper before catalog generation
        run: git rm .github/workflows/fix-acquisition-reservations-once.yml
      - name: Refresh deterministic source catalog
        run: python refs/tools/generate_source_catalog.py
      - name: Validate bounded acquisition changes
        run: |
          pytest tests/test_job_scout_discovery_learning.py tests/test_job_scout_discovery_loop.py
          ruff check src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/plugins/job_scout/discovery_loop.py tests/test_job_scout_discovery_learning.py tests/test_job_scout_discovery_loop.py
      - name: Commit bounded acquisition fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/plugins/job_scout/discovery_loop.py tests/test_job_scout_discovery_learning.py tests/test_job_scout_discovery_loop.py refs/implementation/.sourceCatalogShards refs/implementation/sourceCatalog/index.yaml
          git commit -m "Protect acquisition lanes from revisit crowding"
          git push origin HEAD:dev
