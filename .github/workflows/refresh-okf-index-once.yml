name: Refresh OKF index once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refresh-okf-index-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Regenerate OKF indexes
        run: python refs/tools/generate_okf_indexes.py
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs
          if git diff --cached --quiet; then
            echo "No OKF index changes"
            exit 0
          fi
          git commit -m "Refresh handoff OKF index"
          git push origin HEAD:dev
