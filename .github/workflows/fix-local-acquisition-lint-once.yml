name: Fix local acquisition lint once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fix-local-acquisition-lint-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml ruff
      - name: Wrap regional query literals
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/nerve_center/plugins/job_scout/query_portfolio.py")
          text = source.read_text(encoding="utf-8")
          old = '''        return CompiledQuery(\n            f'{market_terms} "regional council" OR "regional partnership" OR "council of governments"',\n            "broad_web_reference",\n'''
          new = '''        regional_query = (\n            f'{market_terms} "regional council" OR '\n            '"regional partnership" OR "council of governments"'\n        )\n        return CompiledQuery(\n            regional_query,\n            "broad_web_reference",\n'''
          if old not in text:
              raise SystemExit("source pattern not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_job_scout_query_portfolio.py")
          text = test.read_text(encoding="utf-8")
          old = '''    assert regional_query.query == (\n        'Durham Chapel Hill NC "regional council" OR "regional partnership" OR "council of governments"'\n    )\n'''
          new = '''    assert regional_query.query == (\n        'Durham Chapel Hill NC "regional council" OR '\n        '"regional partnership" OR "council of governments"'\n    )\n'''
          if old not in text:
              raise SystemExit("test pattern not found")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")
      - run: ruff check src/nerve_center/plugins/job_scout/query_portfolio.py tests/test_job_scout_query_portfolio.py
      - run: python refs/tools/generate_source_catalog.py
      - name: Commit fix and generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nerve_center/plugins/job_scout/query_portfolio.py tests/test_job_scout_query_portfolio.py refs/implementation/.sourceCatalogShards refs/implementation/sourceCatalog/index.yaml
          git commit -m "Fix local acquisition query formatting"
          git push origin HEAD:dev
