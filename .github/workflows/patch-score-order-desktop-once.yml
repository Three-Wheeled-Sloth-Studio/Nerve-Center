name: Patch Desktop Score Order Once

on:
  push:
    branches:
      - agent/issue-5-desktop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-5-desktop
      - name: Make score history order deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nerve_center/persistence/scoring.py')
          text = path.read_text(encoding='utf-8')
          old = '.order_by(OpportunityScoreModel.created_at.desc())'
          new = '''.order_by(
                        OpportunityScoreModel.created_at.desc(),
                        OpportunityScoreModel.id.desc(),
                    )'''
          if old not in text:
              raise SystemExit('score history ordering target was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-score-order-desktop-once.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make score history order deterministic'
          git push origin HEAD:agent/issue-5-desktop
