name: Update local acquisition handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-local-acquisition-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update handoffs
        shell: python
        run: |
          from pathlib import Path
          import re

          current = Path("refs/handoffs/currentHandoff.md")
          text = current.read_text(encoding="utf-8")
          old = "- The regional-saturation implementation checkpoint is `a1632ff3e497b5c699eb5d4ca12609430d215ba6`. CI run `35137884078` is green across Python, strict refs/source-catalog/agent-context validation, the full test suite, desktop web, and desktop Rust/Tauri."
          new = "- The local-acquisition implementation checkpoint is `fa5cfd0f0558daab0b2a76a059679bf7db4c6b28` (behavior through `708484842782fa91bc84a81fed6a72cec016e7a2`). CI run `35219112384` is green across Python, strict refs/source-catalog/agent-context validation, the full test suite, desktop web, and desktop Rust/Tauri."
          if old not in text:
              raise SystemExit("current-state checkpoint marker not found")
          text = text.replace(old, new, 1)

          marker = "## Regional saturation checkpoint\n"
          soak = '''## Current-head long soak acceptance\n\nThe completed current-head long soak reached planned wind-down cleanly with no process or API listener left running. The run ID was not supplied in the handoff, so none is inferred here.\n\n- Requests: 1,574 / 3,000.\n- LLM calls: 159 / 500.\n- Full scores: 100 / 100, zero failures.\n- Public searches: 221 successful, zero failed.\n- Results returned: 674.\n- Postings inspected: 732.\n- Companies discovered: 6.\n- Retained opportunities: 18.\n- Efficiency: 87 requests per retained opportunity, improved from 365 in the previous long soak.\n- Monitoring timeouts: 102 intermittent timeouts, all recovered.\n\nThis clears general search reliability, scoring reliability, planned wind-down, and timeout recovery as the active blockers. The remaining weakness is local acquisition: zero regional aliases and zero employer candidates. The location-family audit recorded only two conditioned yields across 1,467 attempts while correctly down-weighting 200 poorly performing families.\n\nThe evidence therefore points to local employer/alias acquisition rather than general search, scoring, or another scheduler-wide reliability correction.\n\n## Local acquisition correction\n\nThe next bounded correction improves evidence acquisition without increasing request caps or changing scoring/scheduler weights:\n\n1. local-employer reference queries now preserve the exact discovery intent with quoted phrases such as `"major employers"`, `"largest employers"`, and `"employer directory"`;\n2. regional probes now search across common public regional vocabulary: `regional council`, `regional partnership`, and `council of governments`;\n3. regional title extraction now recognizes generic `Council of Governments`, `Planning Commission`, and `Development District` forms in addition to the existing `Regional Council/Partnership/Commission/Authority/Planning` forms;\n4. civic employer-list heading extraction now accepts common variants such as `Top 25 Private Employers`, `Leading Employers`, `Employer Directory`, and `Employer List`;\n5. deterministic tests prove the broader regional and employer-list patterns while preserving the rule that extracted names are hypotheses only.\n\nNo named company, city, or region exception was added. No extra network path or request allowance was added.\n\n'''
          if marker not in text:
              raise SystemExit("regional checkpoint marker not found")
          text = text.replace(marker, soak + marker, 1)

          replacement = '''## Next bounded slice\n\nRun one isolated 30-minute local-acquisition gate. Do not run another long soak yet.\n\n```powershell\n.\\.venv\\Scripts\\python.exe scripts\\run_job_scout_live.py `\n  --duration-seconds 1800 `\n  --max-requests 500 `\n  --max-llm-calls 80 `\n  --score-limit 25 `\n  --score-failure-limit 5\n```\n\nAudit only the current run and answer these questions in order:\n\n1. Did `regional_alias_probe` and `local_employer` strategies actually execute? If not, the next defect is allocation/cooldown/learned-weight starvation rather than acquisition syntax.\n2. When regional probes execute, do the broadened queries return recognizable regional organization evidence and create any provenance-bearing aliases?\n3. When local-employer strategies execute, do exact-intent queries reach employer-list/directory references, and do those references produce any employer candidates?\n4. Do employer candidates become `local_employer_deepen` hypotheses and proceed through ordinary official-career discovery?\n5. If high-intent references are inspected but candidate yield remains zero, improve HTML/table/list extraction next. Do not change general search or scoring.\n6. If aliases/candidates appear, run a longer soak only after this short gate proves the acquisition path is alive.\n\nKeep Issue #57 open until local acquisition produces real current-run evidence.\n\nDo not add named company, city, aggregator, or region exceptions. Preserve public-source safety boundaries and the rule that extracted employer names are hypotheses rather than company truth.\n\n## Required Reads For Next Slice\n'''
          pattern = re.compile(r"## Next bounded slice\n.*?## Required Reads For Next Slice\n", re.DOTALL)
          if not pattern.search(text):
              raise SystemExit("next-slice section not found")
          current.write_text(pattern.sub(replacement, text, count=1), encoding="utf-8")

          prompt = Path("refs/handoffs/next-dev-prompt.md")
          prompt.write_text('''---\ntype: Development Prompt\ntitle: Next Development Prompt\ndescription: Ready-to-use prompt for the Job Scout regional saturation and employer-path acceptance audit.\nstatus: stable\ntags: [nerve-center, handoff, job-scout, discovery, live-test]\n---\n# Next Development Prompt\n\nContinue Issue #57 directly on `dev`. Do not create a feature branch or PR, and do not close the issue yet.\n\nStart with:\n\n```powershell\npython scripts/agent_context.py --focus "job scout local employer regional alias acquisition employer candidates" --issue 57\n```\n\nUse packet-first/progressive loading. Read `refs/handoffs/currentHandoff.md`, the latest Issue #57 comments, the current-run live report, and only source-catalog matches needed for the evidence. Do not reread repository history.\n\nApplication version remains `0.12.26`. The local-acquisition implementation checkpoint is `fa5cfd0f0558daab0b2a76a059679bf7db4c6b28` with behavior through `708484842782fa91bc84a81fed6a72cec016e7a2`. CI `35219112384` is green across refs/catalog/context validation, Ruff, packaging validation, the full Python suite, desktop web, and Rust/Tauri.\n\nThe completed long soak established that general reliability is healthy: 1,574 requests, 159 LLM calls, 100/100 successful full scores, 221 successful searches with zero failures, 674 results, 732 postings inspected, six companies, and 18 retained opportunities. Efficiency improved to 87 requests per retained opportunity from 365. All 102 intermittent monitoring timeouts recovered.\n\nThe remaining defect is local acquisition: zero regional aliases, zero employer candidates, and only two conditioned location-family yields across 1,467 attempts, despite 200 low-performing families being correctly down-weighted. Do not change general search or scoring unless new evidence contradicts this diagnosis.\n\nThe current slice now uses exact quoted local-employer intent phrases, a broader regional-reference query (`regional council`, `regional partnership`, `council of governments`), broader regional organization-name recognition, and broader employer-list heading recognition such as `Top 25 Private Employers`, `Leading Employers`, and `Employer Directory`. Names remain hypotheses only.\n\nRun this isolated short gate, not another eight-hour soak:\n\n```powershell\n.\\.venv\\Scripts\\python.exe scripts\\run_job_scout_live.py `\n  --duration-seconds 1800 `\n  --max-requests 500 `\n  --max-llm-calls 80 `\n  --score-limit 25 `\n  --score-failure-limit 5\n```\n\nAudit only the current run. First determine whether `regional_alias_probe` and `local_employer` strategies execute. If they do not, investigate learned-weight/cooldown allocation. If they execute, inspect query/result/reference evidence, `regional_aliases_discovered`, and `employer_candidates_discovered`. If high-intent references are inspected but candidate yield stays zero, the next slice is HTML/table/list extraction. If candidates appear, verify they become `local_employer_deepen` hypotheses and enter ordinary official-career resolution.\n\nDo not add named company, city, aggregator, or region exceptions. Preserve request bounds, public-source safety, and the rule that extracted employer names do not directly create company truth.\n\nUpdate both handoffs and Issue #57 with the short-gate run ID, exact head/CI, local strategy attempts, alias/candidate counts, reference evidence, and the next evidence-backed slice. A longer soak is warranted only after this short gate proves the local acquisition path is producing evidence.\n''', encoding="utf-8")
      - name: Commit handoffs and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/handoffs/currentHandoff.md refs/handoffs/next-dev-prompt.md
          git rm .github/workflows/update-local-acquisition-handoff-once.yml
          git commit -m "Record long soak and local acquisition gate"
          git push origin HEAD:dev
