name: Update Job Scout exact-runtime handoff once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-job-scout-exact-runtime-handoff-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python refs/tools/update_job_scout_exact_runtime_handoff_once.py
      - run: python refs/tools/generate_okf_indexes.py
      - name: Commit clean handoff
        shell: bash
        run: |
          rm .github/workflows/update-job-scout-exact-runtime-handoff-once.yml
          rm refs/tools/update_job_scout_exact_runtime_handoff_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record exact-runtime employer evidence gate"
          git push origin dev
