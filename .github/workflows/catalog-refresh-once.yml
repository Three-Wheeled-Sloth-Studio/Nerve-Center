name: One-shot validated source catalog refresh

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare final tree and regenerate catalog
        run: |
          rm .github/workflows/catalog-refresh-once.yml
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate refs and Python
        run: |
          python refs/tools/check_case_collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
          python refs/tools/validate_refs.py --mode initialized
          python scripts/agent_context.py --focus "job scout discovery advantage syndication provenance" --check
          ruff check .
          python scripts/build_windows_backend.py --dry-run
          pytest
      - name: Validate desktop web
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/implementation/sourceCatalog/index.yaml refs/implementation/.sourceCatalogShards refs/planning/index.md .github/workflows/catalog-refresh-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh validated source catalog"
          git push origin HEAD:dev
