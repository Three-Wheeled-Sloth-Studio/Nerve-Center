name: Capture Rust Diagnostic Once

on:
  push:
    branches:
      - agent/issue-5-desktop-clean

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-5-desktop-clean
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture compact compiler output
        run: |
          set +e
          cargo check --message-format=short --manifest-path desktop/src-tauri/Cargo.toml > /tmp/rust-check.txt 2>&1
          status=$?
          mkdir -p refs/testing
          tail -n 120 /tmp/rust-check.txt > refs/testing/rust-diagnostic.txt
          echo "exit_status=$status" >> refs/testing/rust-diagnostic.txt
          rm .github/workflows/capture-rust-diagnostic-once.yml
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: capture Tauri compiler diagnostic'
          git push origin HEAD:agent/issue-5-desktop-clean
