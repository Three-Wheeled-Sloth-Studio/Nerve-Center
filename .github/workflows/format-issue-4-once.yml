name: Format Issue 4 Once

on:
  push:
    branches:
      - agent/issue-4-scoring

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-4-scoring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply repository formatting
        run: |
          ruff check --fix .
          ruff format .
          rm -f refs/testing/formatter-validation.md
          rm -f .github/workflows/format-issue-4-once.yml
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply repository formatting'
          git push origin HEAD:agent/issue-4-scoring
