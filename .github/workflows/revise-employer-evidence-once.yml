name: Revise employer evidence once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/revise-employer-evidence-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply employer evidence revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          learning_path = Path("src/nerve_center/plugins/job_scout/discovery_learning.py")
          learning = learning_path.read_text(encoding="utf-8")

          old_constant = 'MARKET_REFERENCE_QUERY_REVISION = "market_reference_v6"\n'
          new_constant = (
              'MARKET_REFERENCE_QUERY_REVISION = "market_reference_v6"\n'
              'EMPLOYER_LANDSCAPE_EVIDENCE_REVISION = "employer_landscape_v2"\n'
          )
          if old_constant not in learning:
              raise SystemExit("learning constant anchor not found")
          learning = learning.replace(old_constant, new_constant, 1)

          old_candidate = '''                and (\n                    item.dimensions.get("kind") != "public_search"\n                    or item.id in canonical_public_search_ids\n                )\n            ]\n'''
          new_candidate = '''                and (\n                    item.dimensions.get("kind") != "public_search"\n                    or item.id in canonical_public_search_ids\n                )\n                and _employer_deepening_evidence_is_current(item.dimensions)\n            ]\n'''
          if old_candidate not in learning:
              raise SystemExit("candidate filter anchor not found")
          learning = learning.replace(old_candidate, new_candidate, 1)

          old_current = '''        model_is_current_market = (\n            model.dimensions.get("hypothesis_family")\n            in {"local_employer", "regional_alias_probe"}\n            and model.dimensions.get("query_revision")\n            == MARKET_REFERENCE_QUERY_REVISION\n        )\n        existing_is_current_market = (\n            existing is not None\n            and existing.dimensions.get("hypothesis_family")\n            in {"local_employer", "regional_alias_probe"}\n            and existing.dimensions.get("query_revision")\n            == MARKET_REFERENCE_QUERY_REVISION\n        )\n        if (\n            existing is None\n            or (model_is_current_market and not existing_is_current_market)\n            or (\n                model_is_current_market == existing_is_current_market\n                and (model.created_at, model.id)\n                < (existing.created_at, existing.id)\n            )\n        ):\n'''
          new_current = '''        model_is_current_semantics = (\n            (\n                model.dimensions.get("hypothesis_family")\n                in {"local_employer", "regional_alias_probe"}\n                and model.dimensions.get("query_revision")\n                == MARKET_REFERENCE_QUERY_REVISION\n            )\n            or _employer_deepening_evidence_is_current(model.dimensions)\n        )\n        existing_is_current_semantics = (\n            existing is not None\n            and (\n                (\n                    existing.dimensions.get("hypothesis_family")\n                    in {"local_employer", "regional_alias_probe"}\n                    and existing.dimensions.get("query_revision")\n                    == MARKET_REFERENCE_QUERY_REVISION\n                )\n                or _employer_deepening_evidence_is_current(existing.dimensions)\n            )\n        )\n        if (\n            existing is None\n            or (model_is_current_semantics and not existing_is_current_semantics)\n            or (\n                model_is_current_semantics == existing_is_current_semantics\n                and (model.created_at, model.id)\n                < (existing.created_at, existing.id)\n            )\n        ):\n'''
          if old_current not in learning:
              raise SystemExit("canonical preference anchor not found")
          learning = learning.replace(old_current, new_current, 1)

          helper_anchor = '''def _canonical_public_search_ids(\n    models: list[DiscoveryStrategyModel],\n) -> set[str]:\n'''
          helper = '''def _employer_deepening_evidence_is_current(dimensions: dict[str, str]) -> bool:\n    if dimensions.get("hypothesis_family") != "local_employer_deepen":\n        return True\n    authority = dimensions.get("employer_evidence_authority", "")\n    medium = dimensions.get("employer_evidence_medium", "")\n    extraction_method = dimensions.get("employer_evidence_extraction_method", "")\n    if (\n        authority == "civic_attachment"\n        or medium == "attachment"\n        or extraction_method.startswith(("pdf_", "attachment_"))\n    ):\n        return True\n    return (\n        dimensions.get("employer_evidence_revision")\n        == EMPLOYER_LANDSCAPE_EVIDENCE_REVISION\n    )\n\n\n'''
          if helper_anchor not in learning:
              raise SystemExit("canonical helper anchor not found")
          learning = learning.replace(helper_anchor, helper + helper_anchor, 1)
          learning_path.write_text(learning, encoding="utf-8")

          loop_path = Path("src/nerve_center/plugins/job_scout/discovery_loop.py")
          loop = loop_path.read_text(encoding="utf-8")
          old_import = '''from nerve_center.plugins.job_scout.discovery_learning import (\n    DiscoveryStrategySnapshot,\n    JobScoutDiscoveryRepository,\n    StrategyOutcome,\n)\n'''
          new_import = '''from nerve_center.plugins.job_scout.discovery_learning import (\n    EMPLOYER_LANDSCAPE_EVIDENCE_REVISION,\n    DiscoveryStrategySnapshot,\n    JobScoutDiscoveryRepository,\n    StrategyOutcome,\n)\n'''
          if old_import not in loop:
              raise SystemExit("loop import anchor not found")
          loop = loop.replace(old_import, new_import, 1)

          old_evidence = '''                            "employer_evidence_url": result.url,\n                            "employer_evidence_authority": "civic",\n                            "market_provenance": strategy.dimensions.get(\n'''
          new_evidence = '''                            "employer_evidence_url": result.url,\n                            "employer_evidence_authority": "civic",\n                            "employer_evidence_revision": (\n                                EMPLOYER_LANDSCAPE_EVIDENCE_REVISION\n                            ),\n                            "market_provenance": strategy.dimensions.get(\n'''
          if old_evidence not in loop:
              raise SystemExit("loop evidence anchor not found")
          loop = loop.replace(old_evidence, new_evidence, 1)
          loop_path.write_text(loop, encoding="utf-8")

          learning_test_path = Path("tests/test_job_scout_discovery_learning.py")
          tests = learning_test_path.read_text(encoding="utf-8")
          old_test_import = '''from nerve_center.plugins.job_scout.discovery_learning import (\n    JobScoutDiscoveryRepository,\n    StrategyOutcome,\n)\n'''
          new_test_import = '''from nerve_center.plugins.job_scout.discovery_learning import (\n    EMPLOYER_LANDSCAPE_EVIDENCE_REVISION,\n    JobScoutDiscoveryRepository,\n    StrategyOutcome,\n)\n'''
          if old_test_import not in tests:
              raise SystemExit("learning test import anchor not found")
          tests = tests.replace(old_test_import, new_test_import, 1)

          old_reserved = '''            "source_domain": "web",\n            "employer_evidence_authority": "civic",\n        },\n        origin="public_employer_landscape_evidence",\n        base_weight=0.2,\n    )\n    regional = learning.ensure_strategy(\n'''
          new_reserved = '''            "source_domain": "web",\n            "employer_evidence_authority": "civic",\n            "employer_evidence_revision": EMPLOYER_LANDSCAPE_EVIDENCE_REVISION,\n        },\n        origin="public_employer_landscape_evidence",\n        base_weight=0.2,\n    )\n    regional = learning.ensure_strategy(\n'''
          if old_reserved not in tests:
              raise SystemExit("reserved acquisition test anchor not found")
          tests = tests.replace(old_reserved, new_reserved, 1)

          insert_anchor = '''def test_reserved_acquisition_lanes_can_displace_extra_company_revisits(\n'''
          new_test = '''def test_stale_html_employer_evidence_is_not_scheduled_but_current_and_attachment_are(\n    tmp_path: Path,\n) -> None:\n    learning = JobScoutDiscoveryRepository(_database(tmp_path))\n    stale = learning.ensure_strategy(\n        {\n            "kind": "public_search",\n            "hypothesis_family": "local_employer_deepen",\n            "anchor": "Navigation Heading",\n            "location": "Example, NC",\n            "source_domain": "web",\n            "employer_evidence_authority": "civic",\n        },\n        origin="public_employer_landscape_evidence",\n        base_weight=4.0,\n    )\n    current = learning.ensure_strategy(\n        {\n            "kind": "public_search",\n            "hypothesis_family": "local_employer_deepen",\n            "anchor": "Current Systems",\n            "location": "Current, NC",\n            "source_domain": "web",\n            "employer_evidence_authority": "civic",\n            "employer_evidence_revision": EMPLOYER_LANDSCAPE_EVIDENCE_REVISION,\n        },\n        origin="public_employer_landscape_evidence",\n        base_weight=0.2,\n    )\n    legacy_attachment = learning.ensure_strategy(\n        {\n            "kind": "public_search",\n            "hypothesis_family": "local_employer_deepen",\n            "anchor": "Attachment Manufacturing",\n            "location": "Attachment, NC",\n            "source_domain": "web",\n            "employer_evidence_authority": "civic_attachment",\n            "employer_evidence_extraction_method": "pdf_ocr_ranked_employers",\n        },\n        origin="public_employer_attachment_evidence",\n        base_weight=0.2,\n    )\n    normalized_attachment = learning.ensure_strategy(\n        {\n            "kind": "public_search",\n            "hypothesis_family": "local_employer_deepen",\n            "anchor": "Normalized Health",\n            "location": "Normalized, NC",\n            "source_domain": "web",\n            "employer_evidence_authority": "civic",\n            "employer_evidence_medium": "attachment",\n        },\n        origin="public_employer_attachment_evidence",\n        base_weight=0.2,\n    )\n\n    selected = learning.select_strategies(\n        "run-1", limit=4, exploration_floor=1.0\n    )\n    selected_ids = {item.id for item in selected}\n\n    assert stale.id not in selected_ids\n    assert current.id in selected_ids\n    assert legacy_attachment.id in selected_ids\n    assert normalized_attachment.id in selected_ids\n\n\n'''
          if insert_anchor not in tests:
              raise SystemExit("learning test insertion anchor not found")
          tests = tests.replace(insert_anchor, new_test + insert_anchor, 1)
          learning_test_path.write_text(tests, encoding="utf-8")

          loop_test_path = Path("tests/test_job_scout_discovery_loop.py")
          loop_tests = loop_test_path.read_text(encoding="utf-8")
          old_loop_import = '''from nerve_center.plugins.job_scout.discovery_learning import JobScoutDiscoveryRepository\n'''
          new_loop_import = '''from nerve_center.plugins.job_scout.discovery_learning import (\n    EMPLOYER_LANDSCAPE_EVIDENCE_REVISION,\n    JobScoutDiscoveryRepository,\n)\n'''
          if old_loop_import not in loop_tests:
              raise SystemExit("loop test import anchor not found")
          loop_tests = loop_tests.replace(old_loop_import, new_loop_import, 1)
          old_assert = '''    assert candidates[0].dimensions["employer_evidence_authority"] == "civic"\n    assert candidates[0].dimensions["employer_evidence_url"] == (\n'''
          new_assert = '''    assert candidates[0].dimensions["employer_evidence_authority"] == "civic"\n    assert candidates[0].dimensions["employer_evidence_revision"] == (\n        EMPLOYER_LANDSCAPE_EVIDENCE_REVISION\n    )\n    assert candidates[0].dimensions["employer_evidence_url"] == (\n'''
          if old_assert not in loop_tests:
              raise SystemExit("loop test assertion anchor not found")
          loop_tests = loop_tests.replace(old_assert, new_assert, 1)
          loop_test_path.write_text(loop_tests, encoding="utf-8")
          PY
      - name: Refresh deterministic source catalog
        run: python refs/tools/generate_source_catalog.py
      - name: Targeted validation
        run: |
          ruff check src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/plugins/job_scout/discovery_loop.py tests/test_job_scout_discovery_learning.py tests/test_job_scout_discovery_loop.py
          pytest tests/test_job_scout_discovery_learning.py tests/test_job_scout_discovery_loop.py
          python refs/tools/generate_source_catalog.py --check
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/revise-employer-evidence-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise durable employer evidence semantics"
          git push origin dev
