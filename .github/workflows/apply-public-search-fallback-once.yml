name: Apply public search fallback once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-public-search-fallback-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prepare patch helper
        run: python .github/prepare_public_search_fallback_patch.py
      - name: Apply patch
        run: python .github/patch_public_search_fallback_once.py
      - name: Remove one-shot helpers
        run: git rm -f .github/prepare_public_search_fallback_patch.py .github/patch_public_search_fallback_once.py .github/workflows/apply-public-search-fallback-once.yml
      - name: Refresh deterministic indexes
        run: |
          python refs/tools/generate_source_catalog.py
          python refs/tools/generate_okf_indexes.py
      - name: Validate
        run: |
          ruff check src/nerve_center/discovery/search.py src/nerve_center/discovery/public_search_fallback.py src/nerve_center/plugins/job_scout/discovery_learning.py src/nerve_center/plugins/job_scout/discovery_loop.py scripts/run_job_scout_live.py tests/test_public_search_fallback.py tests/test_live_runner_progress.py
          pytest tests/test_public_search_fallback.py tests/test_discovery_connectors.py tests/test_job_scout_discovery_loop.py tests/test_job_scout_discovery_learning.py tests/test_live_runner_progress.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/generate_okf_indexes.py --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add bounded public search provider fallback"
          git push origin dev
