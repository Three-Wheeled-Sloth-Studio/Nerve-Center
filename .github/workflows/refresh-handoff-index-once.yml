name: Refresh handoff index once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/refresh-handoff-index-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install index dependency
        run: python -m pip install pyyaml
      - name: Refresh handoff index
        run: python refs/tools/generate_okf_indexes.py
      - name: Remove helper workflow and commit
        run: |
          git rm .github/workflows/refresh-handoff-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh handoff OKF index"
          git push origin dev
