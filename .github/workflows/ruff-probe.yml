name: Ruff probe

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  ruff-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Show exact Ruff fix
        run: ruff check src/nerve_center/plugins/job_scout/query_portfolio.py --fix --diff
