name: Record runtime identity gate once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/record-runtime-identity-gate-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Update handoffs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current_path = Path("refs/handoffs/currentHandoff.md")
          current = current_path.read_text(encoding="utf-8")
          section = '''

## Runtime-identity diagnostic gate

Run `5ec24553-3886-45e6-a1d1-46ff38a169cc` completed successfully at planned `admission_draining` after the reserved acquisition-lane correction:

- 143 / 500 requests and 41 / 80 LLM calls;
- 25 / 25 full scores, zero failures;
- 24 successful public searches, zero failed, returning 21 raw results;
- zero search results became eligible sources, so zero sources were registered and zero employer-reference pages were inspected;
- 59 source scans completed and 72 known company/source revisits ran;
- 96 strategy attempts across 24 four-slot cycles;
- current-run strategy execution was exactly 72 legacy/revisit records plus 24 `local_employer` strategies;
- zero current-run `regional_alias_probe` executions;
- zero current-run `local_employer_deepen` executions;
- zero companies, career sources, postings, retained opportunities, regional aliases, or employer candidates;
- two transient status-poll timeouts recovered and three low-marginal-yield backoffs occurred.

The absent employer-deepening lane is not independently a scheduler failure in this run because the 24 local-employer searches produced no eligible reference evidence and no new employer hypotheses. The regional result is different: the durable report contains eight fresh `market_reference_v6` `regional_alias_probe` strategies with `attempts == 0` and no `last_attempt_at`. Current `select_strategies` code and its deterministic regression require one of those fresh probes to occupy a protected four-slot lane. The live result therefore contradicts the tested current scheduler path.

Do not retune scheduler weights from this gate. The live runner previously launched its managed API with the active virtual environment's normal import resolution and did not report the resolved backend source path or Git revision. Because application version remains `0.12.26` across these bounded fixes, a stale non-editable package could silently execute older scheduler behavior while still reporting the expected application version.

Checkpoint `d71f316414f0de5a121f7359d87c53fba7b00d98` makes live acceptance self-verifying. `scripts/run_job_scout_live.py` now pins the repository `src` directory first for both the runner and managed API `PYTHONPATH`, preserves any existing `PYTHONPATH`, and writes `runtime_identity` into every report with the resolved `nerve_center` module path, source root, checkout-source boolean, managed-API first path, and `git rev-parse HEAD`. Regression coverage verifies checkout-source resolution and the 40-character Git identity. Targeted Ruff, live-runner tests, discovery-learning tests, and deterministic source-catalog validation passed in workflow `35250882427`.

Next use a short isolated diagnostic gate rather than another long soak. Acceptance starts with `runtime_identity.uses_checkout_source == true`, a module path inside the checkout `src` tree, and `runtime_identity.git_commit` matching the exact pulled `dev` head. Then verify at least one fresh v6 `regional_alias_probe` executes in the first few cycles. If that exact-head run still misses the protected regional lane, instrument canonical-candidate admission/selection directly rather than changing weights. If local-employer searches again return raw results but zero eligible references, diagnose result eligibility/source classification next. Employer deepening is required only when the current run actually produces an evidence-backed employer hypothesis.
'''
          if "## Runtime-identity diagnostic gate" not in current:
              current = current.rstrip() + section + "\n"
              current_path.write_text(current, encoding="utf-8")

          next_prompt = '''---
type: Development Prompt
title: Next Development Prompt
description: Ready-to-use prompt for the Job Scout exact-runtime regional reservation diagnostic gate.
status: stable
tags: [nerve-center, handoff, job-scout, discovery, live-test]
---
# Next Development Prompt

Continue Issue #57 directly on `dev`. Do not create a feature branch or PR, and do not close the issue yet.

Start with:

```powershell
python scripts/agent_context.py --focus "job scout live gate runtime identity regional alias reservation" --issue 57
```

Use packet-first/progressive loading. Read `refs/handoffs/currentHandoff.md`, the latest Issue #57 comments, the next current-run live report, and only source-catalog matches needed for the evidence. Do not reread repository history.

Application version remains `0.12.26`. The latest runtime-integrity checkpoint is `d71f316414f0de5a121f7359d87c53fba7b00d98`. It does not retune discovery. It pins both the live runner and managed API to the checkout `src` directory and records the actual imported module path plus Git SHA in `runtime_identity`. Targeted validation workflow `35250882427` passed Ruff, live-runner regression tests, discovery-learning tests, and deterministic source-catalog validation.

The completed gate is run `5ec24553-3886-45e6-a1d1-46ff38a169cc`. It reached planned `admission_draining` with 143 requests, 41 LLM calls, 25/25 successful full scores, 24 successful public searches, 21 raw search results, 59 completed source scans, 72 known company/source revisits, and 96 strategy attempts. The decisive strategy mix was 72 legacy/revisit executions plus 24 `local_employer` executions, with zero current-run `regional_alias_probe` and zero current-run `local_employer_deepen` executions. All 21 raw local-employer search results were ineligible, so no employer reference was inspected and no current-run employer hypothesis existed to deepen.

The durable report still contains eight fresh `market_reference_v6` regional-probe strategies with zero attempts. Current scheduler code and its deterministic four-slot regression say one fresh regional probe should be protected. Because the live result contradicts that tested path and `0.12.26` does not distinguish bounded internal fixes, treat runtime identity as unproven until the new report fields confirm the exact checkout.

After full CI is green, pull `dev` and run a short isolated diagnostic gate:

```powershell
.\.venv\Scripts\python.exe scripts\run_job_scout_live.py `
  --duration-seconds 300 `
  --max-requests 150 `
  --max-llm-calls 30 `
  --score-limit 10 `
  --score-failure-limit 5
```

Do not run process-level tests, packaging smoke, or another API-owning command concurrently with the gate.

Audit only the new run, in this order:

1. verify `runtime_identity.uses_checkout_source` is true;
2. verify `runtime_identity.module_path` is inside the pulled repository `src` tree;
3. verify `runtime_identity.git_commit` equals the exact pulled `dev` head;
4. verify at least one fresh `market_reference_v6` `regional_alias_probe` executes in the first few cycles;
5. verify `local_employer` remains reachable;
6. require `local_employer_deepen` only if the current run creates an evidence-backed employer hypothesis;
7. if exact-head runtime identity is proven but regional probes still remain untouched, instrument canonical-candidate filtering and reservation selection before changing scheduler policy or weights;
8. if local-employer searches again return raw results but zero eligible references, investigate public-result eligibility/source classification before changing extraction;
9. only return to a 30-minute or long soak after the protected regional path is proven under an exact-head runtime.

Do not add named company, city, aggregator, or region exceptions. Do not weaken the 24-hour cooldown or retune general scoring without new evidence. Preserve request bounds, public-source safety, the `gemma3:4b` general model plus schema-failure fallback to `qwen2.5:7b-instruct`, and the rule that extracted employer names remain hypotheses until ordinary public company/career validation succeeds.

Update both handoffs and Issue #57 with the diagnostic run ID, exact runtime identity, regional/deepening attempts, result eligibility evidence, exact head/CI, and the next evidence-backed slice. Keep Issue #57 open until usable current-run employer/alias evidence proceeds through ordinary company/career discovery.
'''
          Path("refs/handoffs/next-dev-prompt.md").write_text(next_prompt, encoding="utf-8")
          PY
      - name: Remove helper and refresh OKF indexes
        shell: bash
        run: |
          rm .github/workflows/record-runtime-identity-gate-once.yml
          python refs/tools/generate_okf_indexes.py
      - name: Commit handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record exact-runtime acquisition gate"
          git push origin dev
