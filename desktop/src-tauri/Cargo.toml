[package]
name = "nerve-center-desktop"
version = "0.12.8"
description = "Windows desktop shell for Nerve Center"
authors = ["Three-Wheeled Sloth Studio"]
edition = "2021"

[lib]
name = "nerve_center_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
